name: Perfil del día

on:
  schedule:
    - cron: '0 11 * * *' # 6:00 a. m. en Bogotá
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/actualizar-readme.mjs
      - name: Tarjeta y horario
        run: node scripts/tarjeta.mjs
        continue-on-error: true # si falla la API, el chiste igual se publica
        env:
          # Con PERFIL_TOKEN (token personal de solo lectura) cuenta también los repos privados.
          GH_TOKEN: ${{ secrets.PERFIL_TOKEN || github.token }}
      - name: Commit
        run: |
          git config user.name "eliasgdev"
          git config user.email "198462668+eliasgdev@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet && exit 0
          git commit -m "docs: perfil del día $(TZ=America/Bogota date +%F)"
          git push
